<title>À louer | Maison 4 chambres à Soumagne</title>
 
<meta name="description"
      content="À louer à Soumagne : maison familiale 4 chambres avec jardin, terrasse, garage et grand grenier semi-aménagé dans un clos résidentiel calme.">
 
<style>
    :root {
        --ink: #17201d;
        --muted: #68716d;
        --cream: #f4f0e8;
        --paper: #fffdf9;
        --accent: #9b3d2f;
        --accent-dark: #743027;
        --green: #0f5b46;
        --green-dark: #083d30;
        --line: #e3ddd2;
        --shadow: 0 18px 55px rgba(20, 25, 22, .10);
    }
 
    * { box-sizing: border-box; }
 
    html { scroll-behavior: smooth; }
 
    body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
            BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--cream);
        line-height: 1.65;
    }
 
    a { color: inherit; text-decoration: none; }
 
    img { display: block; max-width: 100%; }
 
    .wrap {
        width: min(1180px, 92%);
        margin: auto;
    }
 
    /* MENU */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        background: rgba(255, 253, 249, .96);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
    }
 
    .nav-container {
        width: min(1240px, 94%);
        margin: auto;
        min-height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 25px;
    }
 
    .logo {
        font-family: Georgia, serif;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -.03em;
        white-space: nowrap;
    }
 
    .nav-links {
        display: flex;
        align-items: center;
        gap: 22px;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
    }
 
    .nav-links::-webkit-scrollbar { display: none; }
 
    .nav-links a {
        font-size: .77rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .07em;
        transition: color .2s ease, transform .2s ease;
    }
 
    .nav-links a:hover {
        color: var(--accent);
        transform: translateY(-1px);
    }
 
    .nav-rent {
        background: var(--accent);
        color: white !important;
        padding: 11px 18px;
        border-radius: 999px;
    }
 
    .nav-rent:hover { background: var(--accent-dark); }
 
    /* HERO */
    .hero {
        min-height: 92vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: var(--paper);
        padding-top: 74px;
    }
 
    .hero-copy {
        padding: 70px clamp(30px, 7vw, 90px) 80px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
 
    .kicker {
        display: inline-block;
        margin-bottom: 28px;
        color: var(--accent);
        font-size: clamp(3.2rem, 7vw, 7rem);
        line-height: .82;
        font-weight: 950;
        letter-spacing: .035em;
        text-transform: uppercase;
    }
 
    h1 {
        font-family: Georgia, serif;
        font-size: clamp(3rem, 6vw, 6rem);
        line-height: .95;
        font-weight: 500;
        margin: 0 0 24px;
        letter-spacing: -.05em;
    }
 
    .hero-subtitle {
        font-size: clamp(1.1rem, 2vw, 1.42rem);
        color: var(--muted);
        max-width: 620px;
        margin: 0;
    }
 
    .property-details {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin: 8px 0 22px;
    }
 
    .property-details span {
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: .9rem;
        font-weight: 750;
        background: var(--cream);
    }
 
    .address {
        margin-top: 18px;
        font-weight: 700;
    }
 
    .future-peb {
        margin-top: 24px;
        padding: 18px 20px;
        border-left: 4px solid var(--green);
        background: #edf5f0;
        color: var(--green-dark);
    }
 
    .future-peb strong {
        display: block;
        margin-bottom: 4px;
    }
 
    .cta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 30px;
    }
 
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 23px;
        border-radius: 999px;
        font-weight: 800;
        border: 1px solid var(--ink);
        transition: transform .2s ease, background .2s ease;
    }
 
    .btn:hover { transform: translateY(-2px); }
 
    .btn.primary {
        background: var(--ink);
        color: white;
    }
 
    .btn.primary:hover { background: var(--accent-dark); }
 
    .btn.light { background: transparent; }
 
    .hero-photo {
        min-height: 92vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #eeeae2;
        padding: 24px;
    }
 
    .hero-photo img {
        width: 100%;
        height: 100%;
        max-height: calc(92vh - 48px);
        object-fit: contain;
        object-position: center;
    }
 
    /* SECTIONS */
    section { padding: clamp(65px, 8vw, 110px) 0; }
 
    .section-head {
        max-width: 820px;
        margin-bottom: 45px;
    }
 
    .eyebrow {
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: .15em;
        font-size: .75rem;
        font-weight: 850;
    }
 
    h2 {
        font-family: Georgia, serif;
        font-size: clamp(2.3rem, 4vw, 4rem);
        line-height: 1;
        margin: 10px 0 18px;
        font-weight: 500;
        letter-spacing: -.03em;
    }
 
    .lead {
        font-size: 1.08rem;
        color: var(--muted);
    }
 
    /* INTRO */
    .intro { background: var(--paper); }
 
    .intro-grid {
        display: grid;
        grid-template-columns: .8fr 1.2fr;
        gap: 70px;
        align-items: start;
    }
 
    .intro-title {
        font-family: Georgia, serif;
        font-size: clamp(2rem, 3vw, 2.8rem);
        line-height: 1.1;
    }
 
    .intro-text {
        font-size: 1.12rem;
        color: var(--muted);
    }
 
    /* COMPOSITION */
    .composition { background: var(--cream); }
 
    .rooms {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
    }
 
    .room-card {
        background: var(--paper);
        padding: 30px;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
    }
 
    .room-number {
        font-size: .75rem;
        color: var(--accent);
        font-weight: 850;
        text-transform: uppercase;
        letter-spacing: .13em;
    }
 
    .room-card h3 {
        font-family: Georgia, serif;
        font-size: 1.8rem;
        margin: 8px 0 20px;
    }
 
    .room-card ul {
        padding: 0;
        margin: 0;
        list-style: none;
    }
 
    .room-card li {
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
    }
 
    .room-card li:last-child { border-bottom: 0; }
 
    /* POINTS FORTS */
    .features { background: var(--paper); }
 
    .feature-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 16px;
    }
 
    .feature {
        padding: 26px;
        border: 1px solid var(--line);
        background: var(--cream);
    }
 
    .feature-icon {
        font-size: 1.8rem;
        margin-bottom: 12px;
    }
 
    .feature strong {
        display: block;
        margin-bottom: 7px;
    }
 
    .feature span {
        color: var(--muted);
        font-size: .95rem;
    }
 
    .peb-note {
        margin-top: 25px;
        padding: 22px 24px;
        background: #edf5f0;
        border: 1px solid #c8ddd2;
        color: var(--green-dark);
    }
 
    /* GALERIE */
    .gallery-section { background: var(--cream); }
 
    .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
    }
 
    .gallery-item {
        position: relative;
        overflow: hidden;
        background: var(--paper);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
    }
 
    .gallery-item a {
        display: block;
        width: 100%;
        height: 100%;
    }
 
    .gallery-item img {
        width: 100%;
        height: 310px;
        object-fit: cover;
        transition: transform .35s ease, filter .35s ease;
    }
 
    .gallery-item:hover img {
        transform: scale(1.025);
        filter: brightness(1.04);
    }
 
    .gallery-item.large { grid-column: span 2; }
 
    .gallery-item.large img { height: 430px; }
 
    .gallery-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 14px 16px;
        color: white;
        font-size: .9rem;
        font-weight: 800;
        background: linear-gradient(to top, rgba(0,0,0,.74), rgba(0,0,0,0));
    }
 
    /* LOCALISATION */
    .location { background: var(--paper); }
 
    .location-grid {
        display: grid;
        grid-template-columns: .75fr 1.25fr;
        gap: 50px;
        align-items: stretch;
    }
 
    .location-info {
        padding: 35px;
        background: var(--cream);
        border: 1px solid var(--line);
    }
 
    .location-info h3 {
        font-family: Georgia, serif;
        font-size: 1.8rem;
        line-height: 1.2;
        margin-top: 0;
    }
 
    .location-info p { color: var(--muted); }
 
    .map {
        min-height: 420px;
        overflow: hidden;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
    }
 
    .map iframe {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 420px;
        border: 0;
    }
 
    /* CONTACT */
    .contact {
        background: var(--ink);
        color: white;
    }
 
    .contact-grid {
        display: grid;
        grid-template-columns: 1fr .7fr;
        gap: 60px;
        align-items: center;
    }
 
    .contact h2 { color: white; }
 
    .contact p {
        color: #d6dcda;
        max-width: 650px;
    }
 
    .contact-box {
        padding: 32px;
        border: 1px solid rgba(255,255,255,.18);
        background: rgba(255,255,255,.05);
    }
 
    .contact-box strong {
        display: block;
        font-size: 1.25rem;
        margin-bottom: 8px;
    }
 
    .contact .btn {
        border-color: white;
        color: white;
        margin-top: 18px;
    }
 
    /* FOOTER */
    footer {
        background: #101614;
        color: #aeb7b3;
        padding: 25px 0;
        font-size: .9rem;
    }
 
    /* TABLET */
    @media (max-width: 1100px) {
        .feature-grid { grid-template-columns: repeat(3, 1fr); }
    }
 
    @media (max-width: 900px) {
        .nav-container { min-height: 64px; }
 
        .hero { grid-template-columns: 1fr; }
 
        .hero-copy { padding: 105px 6% 60px; }
 
        .hero-photo {
            min-height: auto;
            padding: 18px;
        }
 
        .hero-photo img {
            max-height: none;
            height: auto;
        }
 
        .intro-grid,
        .location-grid,
        .contact-grid {
            grid-template-columns: 1fr;
            gap: 35px;
        }
 
        .rooms { grid-template-columns: 1fr; }
 
        .feature-grid { grid-template-columns: 1fr 1fr; }
 
        .gallery { grid-template-columns: 1fr 1fr; }
 
        .gallery-item.large { grid-column: span 2; }
 
        .gallery-item img { height: 260px; }
 
        .gallery-item.large img { height: 360px; }
    }
 
    /* MOBILE */
    @media (max-width: 520px) {
        .logo { font-size: 1.05rem; }
 
        .nav-container {
            width: 96%;
            gap: 12px;
        }
 
        .nav-links { gap: 10px; }
 
        .nav-links a { font-size: .62rem; }
 
        .kicker { font-size: 3.2rem; }
 
        h1 { font-size: 3.2rem; }
 
        .property-details span {
            font-size: .8rem;
            padding: 7px 11px;
        }
 
        .feature-grid { grid-template-columns: 1fr; }
 
        .gallery { grid-template-columns: 1fr; }
 
        .gallery-item.large { grid-column: span 1; }
 
        .gallery-item img,
        .gallery-item.large img {
            height: 300px;
        }
 
        .location-info { padding: 25px; }
    }
</style>
